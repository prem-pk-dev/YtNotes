<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YT Study Notes Pro</title><link rel="stylesheet" href="popup.css"></head>
<body><main class="ytsnp-popup"><header class="ytsnp-top"><div><div class="ytsnp-brand">✦ YT Study Notes <span>Pro</span></div><p>Make every video a study session.</p></div><button id="theme" class="ytsnp-icon" aria-label="Toggle theme">☼</button></header>
<section class="ytsnp-stats"><div><strong id="videos">0</strong><span>Videos studied</span></div><div><strong id="notes">0</strong><span>Notes saved</span></div></section>
<section class="ytsnp-plan"><div class="ytsnp-row"><strong>Current plan</strong><span id="plan" class="ytsnp-badge">FREE</span></div><div class="ytsnp-license"><input id="license" placeholder="License key" autocomplete="off"><button id="activate">Activate</button></div><small id="message">Test Pro locally with PRO-TEST-2026</small></section>
<section class="ytsnp-recent"><div class="ytsnp-row"><strong>Recently studied</strong><span class="ytsnp-muted">Latest first</span></div><div id="recent" class="ytsnp-list"><p class="ytsnp-empty">No study notes yet. Open a YouTube video to begin.</p></div></section>
<footer>Stored locally on this device · No account required</footer></main><script src="popup.js"></script></body></html>
